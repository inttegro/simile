openapi: 3.1.2
info:
  title: Parameter bundle
  version: 1.0.0
paths:
  /links/open:
    get:
      operationId: openLink
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
            pattern: '^flink_[a-z]+$'
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 8
      responses:
        "204":
          description: Opened
