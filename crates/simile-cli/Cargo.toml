[package]
name = "simile-cli"
description = "The Simile command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[package.metadata.dist]
dist = true

[[bin]]
name = "simile"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
anstyle.workspace = true
axum.workspace = true
clap.workspace = true
crossterm.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
simile-core = { workspace = true, features = ["native", "smithy"] }
simile-heuristics.workspace = true
simile-learning.workspace = true
simile-server.workspace = true
simile-spec.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["local-offset"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
webbrowser.workspace = true

[dev-dependencies]
snapbox.workspace = true

[lints]
workspace = true
