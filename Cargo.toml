[workspace]
members = ["crates/simile-cli", "crates/simile-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Inttegro"]
repository = "https://github.com/inttegro/simile"

[workspace.dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
simile-core = { version = "=0.1.0", path = "crates/simile-core" }
snapbox = { version = "1.2.2", features = ["cmd"] }
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "thin"
