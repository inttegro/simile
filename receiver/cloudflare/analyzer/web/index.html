<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Review and verify reproducible Simile reports." />
    <title>Simile Report Analyzer</title>
    <script>
      (() => {
        const savedTheme = window.localStorage.getItem("simile-theme");
        document.documentElement.dataset.theme = savedTheme === "light" ? "light" : "dark";
      })();
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toasts" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <dialog id="action-dialog" class="action-dialog"></dialog>
    <script type="module" src="/app.js"></script>
  </body>
</html>
